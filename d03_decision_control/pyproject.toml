[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptf-d03-decision-control"
version = "0.1.0"
description = "APTF D03 decision and control deterministic contract"
requires-python = ">=3.11"
authors = [{ name = "APTF" }]
dependencies = [
  "aptf-d04-trading-envelope==0.1.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
