[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptf-runtime"
version = "0.2.0"
description = "External temporal event envelopes for frozen APTF component payloads"
requires-python = ">=3.11"
authors = [{ name = "APTF" }]
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
