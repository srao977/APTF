[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aptf-d04-trading-envelope"
version = "0.1.0"
description = "APTF D04 Trading Envelope Physical Design v0.1 prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "APTF" }]
dependencies = [
  "aptf-d02-return-shape==0.2.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
